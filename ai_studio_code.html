<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SKY KING - 3D Realistic Airplane Crash Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0a0e1a;
      --card-bg: #131a2e;
      --card-border: #222d4a;
      --accent-cyan: #00e5ff;
      --accent-gold: #ffd600;
      --accent-green: #00e676;
      --accent-red: #ff1744;
      --accent-purple: #b388ff;
      --text-main: #f0f4ff;
      --text-muted: #798bb4;
      --btn-grad-flight: linear-gradient(135deg, #00b0ff, #0081cb);
      --btn-grad-cash: linear-gradient(135deg, #00e676, #00a152);
      --btn-grad-wait: linear-gradient(135deg, #2a354d, #1c2333);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      padding: 10px;
    }

    .game-wrapper {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #0f1526;
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 14px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      position: relative;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand-icon {
      font-size: 1.4rem;
      filter: drop-shadow(0 0 8px var(--accent-cyan));
    }

    .brand-title {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 1.3rem;
      letter-spacing: 1.5px;
      background: linear-gradient(45deg, #fff, var(--accent-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-icon {
      background: #1a233d;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      height: 34px;
      min-width: 34px;
      padding: 0 8px;
      border-radius: 17px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      transition: all 0.2s;
    }

    .btn-icon.active {
      color: var(--accent-cyan);
      border-color: var(--accent-cyan);
      box-shadow: 0 0 8px rgba(0, 229, 255, 0.3);
    }

    .btn-icon.muted {
      color: var(--text-muted);
      opacity: 0.6;
    }

    /* Volume Slider */
    .volume-slider-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #12192e;
      border: 1px solid var(--card-border);
      padding: 4px 8px;
      border-radius: 14px;
    }

    .volume-slider {
      -webkit-appearance: none;
      width: 55px;
      height: 4px;
      border-radius: 2px;
      background: #253354;
      outline: none;
      cursor: pointer;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent-cyan);
      box-shadow: 0 0 6px var(--accent-cyan);
      cursor: pointer;
    }

    /* Balance Bar */
    .balance-pill {
      background: linear-gradient(180deg, #18233d, #111a30);
      border: 1px solid #2a3b63;
      padding: 8px 14px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .balance-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .balance-val {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--accent-gold);
      display: flex;
      align-items: center;
      gap: 4px;
      text-shadow: 0 0 10px rgba(255, 214, 0, 0.3);
    }

    /* Round History */
    .history-section {
      background: #101627;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .history-header span:first-child {
      display: flex;
      align-items: center;
      gap: 4px;
      color: var(--accent-cyan);
    }

    .history-feed {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }
    .history-feed::-webkit-scrollbar {
      display: none;
    }

    .history-chip {
      position: relative;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      background: #141b2d;
      border: 1px solid #273556;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }

    .history-chip.latest-chip {
      box-shadow: 0 0 10px rgba(0, 229, 255, 0.4);
      border-color: var(--accent-cyan);
    }

    .badge-new {
      font-size: 0.55rem;
      padding: 1px 4px;
      border-radius: 4px;
      background: var(--accent-cyan);
      color: #000;
      font-weight: 900;
      animation: flash 1.2s infinite;
    }

    @keyframes flash {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .chip-low { color: #00b0ff; border-color: rgba(0, 176, 255, 0.4); }
    .chip-med { color: #81c784; border-color: rgba(129, 199, 132, 0.4); }
    .chip-high { color: var(--accent-gold); border-color: rgba(255, 214, 0, 0.5); }
    .chip-epic { color: var(--accent-purple); border-color: rgba(179, 136, 255, 0.6); }

    /* Canvas Arena */
    .arena-container {
      position: relative;
      width: 100%;
      height: 270px;
      background: radial-gradient(circle at 10% 90%, #151e36 0%, #080b15 100%);
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--card-border);
      box-shadow: inset 0 0 45px rgba(0, 0, 0, 0.7);
      transform: translate3d(0, 0, 0);
    }

    .screen-shake {
      animation: shake 0.45s cubic-bezier(.36,.07,.19,.97) both;
    }

    @keyframes shake {
      10%, 90% { transform: translate3d(-3px, -2px, 0); }
      20%, 80% { transform: translate3d(4px, 3px, 0); }
      30%, 50%, 70% { transform: translate3d(-6px, -4px, 0); }
      40%, 60% { transform: translate3d(6px, 4px, 0); }
    }

    #flightCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* HUD Overlay */
    .hud-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .multiplier-display {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 3.2rem;
      line-height: 1;
      color: #fff;
      text-shadow: 0 0 20px rgba(0, 229, 255, 0.6);
      transition: transform 0.08s ease;
      will-change: transform;
    }

    .multiplier-display.crashed {
      color: var(--accent-red);
      text-shadow: 0 0 25px rgba(255, 23, 68, 0.9);
      animation: crashShake 0.4s ease-in-out;
    }

    @keyframes crashShake {
      0%, 100% { transform: translate(0, 0); }
      20% { transform: translate(-6px, 4px); }
      40% { transform: translate(6px, -4px); }
      60% { transform: translate(-4px, -2px); }
      80% { transform: translate(4px, 2px); }
    }

    .game-status-pill {
      margin-top: 8px;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 20px;
      background: rgba(10, 16, 30, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
    }

    .last-crash-banner {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.1rem;
      font-weight: 900;
      color: var(--accent-red);
      background: rgba(255, 23, 68, 0.15);
      border: 1px solid rgba(255, 23, 68, 0.4);
      padding: 4px 12px;
      border-radius: 8px;
      margin-bottom: 6px;
      display: none;
      letter-spacing: 1px;
    }

    /* Countdown Intermission Screen */
    .countdown-overlay {
      position: absolute;
      inset: 0;
      background: rgba(10, 14, 25, 0.84);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      z-index: 10;
    }

    .countdown-prev-crash {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .countdown-prev-crash span {
      font-family: 'Orbitron', sans-serif;
      color: var(--accent-red);
      font-size: 1.05rem;
    }

    .countdown-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--accent-cyan);
    }

    .countdown-number {
      font-family: 'Orbitron', sans-serif;
      font-size: 3.2rem;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 0 20px var(--accent-cyan);
      line-height: 1;
    }

    .countdown-progress-bar {
      width: 180px;
      height: 6px;
      background: #1b2640;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--card-border);
    }

    .countdown-progress-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, var(--accent-cyan), #00b0ff);
      transition: width 0.1s linear;
    }

    /* Controls Panel */
    .controls-panel {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 12px;
    }

    .bet-input-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .bet-box {
      flex: 1;
      position: relative;
    }

    .bet-box input {
      width: 100%;
      background: #0b0f1a;
      border: 1px solid #233152;
      border-radius: 10px;
      padding: 10px 12px 10px 38px;
      color: #fff;
      font-family: 'Orbitron', sans-serif;
      font-size: 1.05rem;
      font-weight: 700;
      outline: none;
      transition: border-color 0.2s;
    }

    .bet-box input:focus {
      border-color: var(--accent-cyan);
    }

    .bet-box-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.05rem;
    }

    .quick-bets {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    .btn-quick {
      background: #1b253f;
      border: 1px solid #29385c;
      color: var(--text-main);
      font-weight: 700;
      font-size: 0.85rem;
      padding: 8px 4px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-quick:active {
      transform: scale(0.96);
      background: #233152;
    }

    /* Auto Settings Bar */
    .auto-settings-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 6px;
      font-size: 0.85rem;
      color: var(--text-muted);
      border-top: 1px solid rgba(255,255,255,0.05);
      padding-top: 8px;
    }

    .auto-toggle-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .auto-toggle-wrap input[type="checkbox"] {
      accent-color: var(--accent-cyan);
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .auto-cash-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .auto-cash-wrap input {
      width: 65px;
      background: #0b0f1a;
      border: 1px solid #233152;
      border-radius: 6px;
      padding: 4px 6px;
      color: #fff;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.85rem;
      text-align: center;
    }

    /* Main Action Button */
    .btn-main {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.2rem;
      font-weight: 900;
      letter-spacing: 1px;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 14px 10px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      transition: all 0.2s;
    }

    .btn-main:active {
      transform: scale(0.98);
    }

    .btn-main.bet-ready {
      background: var(--btn-grad-flight);
      box-shadow: 0 6px 20px rgba(0, 176, 255, 0.4);
    }

    .btn-main.bet-placed {
      background: linear-gradient(135deg, #e65100, #ff9800);
      box-shadow: 0 6px 20px rgba(255, 152, 0, 0.4);
    }

    .btn-main.cashout {
      background: var(--btn-grad-cash);
      box-shadow: 0 6px 20px rgba(0, 230, 118, 0.4);
      animation: pulseGreen 1.2s infinite;
    }

    .btn-main.waiting {
      background: var(--btn-grad-wait);
      color: #90a4ae;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-subtext {
      font-family: 'Rajdhani', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      opacity: 0.95;
    }

    @keyframes pulseGreen {
      0%, 100% { box-shadow: 0 0 10px rgba(0, 230, 118, 0.4); }
      50% { box-shadow: 0 0 25px rgba(0, 230, 118, 0.8); }
    }

    .disclaimer {
      font-size: 0.72rem;
      color: #55688f;
      text-align: center;
      line-height: 1.3;
    }

    .disclaimer span {
      color: var(--accent-cyan);
    }
  </style>
</head>
<body>

<div class="game-wrapper">
  <!-- Header -->
  <header class="header">
    <div class="brand">
      <span class="brand-icon">✈️</span>
      <span class="brand-title">SKY KING</span>
    </div>
    <div class="header-actions">
      <!-- Master Sound Toggle -->
      <button class="btn-icon active" id="soundBtn" title="Sound ON/OFF">
        <span id="soundIcon">🔊</span>
      </button>

      <!-- Volume Slider -->
      <div class="volume-slider-wrap" title="Master Volume">
        <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.05" value="0.75">
      </div>

      <!-- Reload 1000 Coins -->
      <button class="btn-icon" id="resetBankBtn" title="Reload 1000 Coins">
        <span>🔄</span>
      </button>
    </div>
  </header>

  <!-- Balance Bar -->
  <div class="balance-pill">
    <span class="balance-label">Virtual Balance</span>
    <span class="balance-val"><span style="color:#ffd600;">🪙</span> <span id="balanceText">1,000</span> <span style="font-size:0.75rem; color:var(--text-muted);">VC</span></span>
  </div>

  <!-- Dedicated Round History Section -->
  <section class="history-section">
    <div class="history-header">
      <span>🕒 Round History (Last 10)</span>
      <span>Newest ➔ Oldest</span>
    </div>
    <div class="history-feed" id="historyFeed"></div>
  </section>

  <!-- Canvas Flight Screen -->
  <div class="arena-container" id="arenaContainer">
    <canvas id="flightCanvas"></canvas>
    
    <!-- HUD Layer -->
    <div class="hud-overlay">
      <div class="last-crash-banner" id="lastCrashBanner">CRASHED @ 0.00x</div>
      <div class="multiplier-display" id="multiplierText">1.00x</div>
      <div class="game-status-pill" id="statusPill">STARTING AUTO SYSTEM...</div>
    </div>

    <!-- 5-Second Intermission Screen -->
    <div class="countdown-overlay" id="countdownOverlay" style="display:none;">
      <div class="countdown-prev-crash">Last Round: <span id="prevCrashValue">1.00x</span></div>
      <div class="countdown-title">NEXT ROUND IN</div>
      <div class="countdown-number" id="countdownSecText">5.0s</div>
      <div class="countdown-progress-bar">
        <div class="countdown-progress-fill" id="countdownFill"></div>
      </div>
    </div>
  </div>

  <!-- Betting & Auto Controls -->
  <div class="controls-panel">
    <div class="bet-input-row">
      <div class="bet-box">
        <span class="bet-box-icon">🪙</span>
        <input type="number" id="betInput" value="50" min="10" step="10">
      </div>
      <button class="btn-quick" id="btnHalf">½</button>
      <button class="btn-quick" id="btnDouble">2X</button>
      <button class="btn-quick" id="btnMax">MAX</button>
    </div>

    <div class="quick-bets">
      <button class="btn-quick" onclick="setBet(20)">20</button>
      <button class="btn-quick" onclick="setBet(50)">50</button>
      <button class="btn-quick" onclick="setBet(100)">100</button>
      <button class="btn-quick" onclick="setBet(250)">250</button>
    </div>

    <div class="auto-settings-bar">
      <label class="auto-toggle-wrap">
        <input type="checkbox" id="autoBetCheckbox" checked>
        <span>Auto-Bet Each Round</span>
      </label>
      <div class="auto-cash-wrap">
        <span>Auto Cash:</span>
        <input type="number" id="autoCashInput" placeholder="2.00" step="0.1" min="1.1">
        <span>X</span>
      </div>
    </div>

    <!-- Main Responsive Button -->
    <button class="btn-main bet-ready" id="mainActionBtn">
      <span id="btnMainLabel">BET FOR NEXT ROUND</span>
      <span class="btn-subtext" id="btnSubLabel">50 VC</span>
    </button>
  </div>

  <div class="disclaimer">
    <span>Virtual coins only</span> — Free arcade simulation. No real money or gambling involved.
  </div>
</div>

<script>
/**
 * SKY KING - Aviation Electronic Sound Engine
 */
class AviationSoundSystem {
  constructor() {
    this.ctx = null;
    this.masterGain = null;
    this.sfxGain = null;
    this.riserGain = null;

    this.soundEnabled = true;
    this.userVolume = 0.75;
    this.audioUnlocked = false;

    this.riserOsc1 = null;
    this.riserOsc2 = null;
    this.riserFilter = null;
    this.lfoOsc = null;
    this.lfoGain = null;
    this.isRiserActive = false;
  }

  init() {
    if (this.ctx) {
      if (this.ctx.state === 'suspended') {
        this.ctx.resume();
      }
      return;
    }

    try {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AudioContextClass();

      this.masterGain = this.ctx.createGain();
      this.masterGain.gain.setValueAtTime(this.soundEnabled ? this.userVolume : 0, this.ctx.currentTime);
      this.masterGain.connect(this.ctx.destination);

      this.sfxGain = this.ctx.createGain();
      this.sfxGain.gain.setValueAtTime(0.85, this.ctx.currentTime);
      this.sfxGain.connect(this.masterGain);

      this.riserGain = this.ctx.createGain();
      this.riserGain.gain.setValueAtTime(0, this.ctx.currentTime);
      this.riserGain.connect(this.masterGain);

      this.audioUnlocked = true;
    } catch (e) {
      console.warn("Web Audio initialization error:", e);
    }
  }

  startRiser() {
    if (!this.soundEnabled || !this.audioUnlocked) return;
    this.init();
    this.stopRiser();

    try {
      const now = this.ctx.currentTime;
      this.isRiserActive = true;

      this.riserOsc1 = this.ctx.createOscillator();
      this.riserOsc2 = this.ctx.createOscillator();
      this.riserFilter = this.ctx.createBiquadFilter();

      this.lfoOsc = this.ctx.createOscillator();
      this.lfoGain = this.ctx.createGain();

      this.riserOsc1.type = 'sawtooth';
      this.riserOsc2.type = 'square';

      this.riserOsc1.frequency.setValueAtTime(115, now);
      this.riserOsc2.frequency.setValueAtTime(117, now);

      this.riserFilter.type = 'bandpass';
      this.riserFilter.Q.setValueAtTime(4.2, now);
      this.riserFilter.frequency.setValueAtTime(320, now);

      this.lfoOsc.type = 'sine';
      this.lfoOsc.frequency.setValueAtTime(4.5, now);
      this.lfoGain.gain.setValueAtTime(0.08, now);

      this.lfoOsc.connect(this.lfoGain.gain);
      this.riserOsc1.connect(this.riserFilter);
      this.riserOsc2.connect(this.riserFilter);
      this.riserFilter.connect(this.riserGain);

      this.riserGain.gain.cancelScheduledValues(now);
      this.riserGain.gain.setValueAtTime(0.001, now);
      this.riserGain.gain.linearRampToValueAtTime(0.24, now + 0.3);

      this.riserOsc1.start(now);
      this.riserOsc2.start(now);
      this.lfoOsc.start(now);
    } catch (e) {}
  }

  updateRiser(multiplier) {
    if (!this.isRiserActive || !this.ctx || !this.riserOsc1) return;
    try {
      const now = this.ctx.currentTime;
      const targetFreq = Math.min(980, 115 * Math.pow(multiplier, 0.58));
      this.riserOsc1.frequency.setTargetAtTime(targetFreq, now, 0.08);
      this.riserOsc2.frequency.setTargetAtTime(targetFreq * 1.015, now, 0.08);

      const filterFreq = Math.min(3200, 320 + (multiplier - 1) * 220);
      this.riserFilter.frequency.setTargetAtTime(filterFreq, now, 0.08);

      const lfoRate = Math.min(14, 4.5 + (multiplier - 1) * 1.2);
      this.lfoOsc.frequency.setTargetAtTime(lfoRate, now, 0.1);
    } catch (e) {}
  }

  stopRiser() {
    if (!this.isRiserActive) return;
    this.isRiserActive = false;
    if (!this.ctx) return;

    try {
      const now = this.ctx.currentTime;
      if (this.riserGain) {
        this.riserGain.gain.cancelScheduledValues(now);
        this.riserGain.gain.setValueAtTime(0, now);
      }
      setTimeout(() => {
        try {
          this.riserOsc1?.stop();
          this.riserOsc2?.stop();
          this.lfoOsc?.stop();
          this.riserOsc1?.disconnect();
          this.riserOsc2?.disconnect();
        } catch (err) {}
        this.riserOsc1 = null;
        this.riserOsc2 = null;
        this.lfoOsc = null;
      }, 50);
    } catch (e) {}
  }

  playCrash() {
    this.stopRiser();
    if (!this.soundEnabled || !this.audioUnlocked) return;
    this.init();

    try {
      const now = this.ctx.currentTime;
      const bufferSize = this.ctx.sampleRate * 0.75;
      const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = Math.random() * 2 - 1;
      }

      const noise = this.ctx.createBufferSource();
      noise.buffer = buffer;

      const noiseFilter = this.ctx.createBiquadFilter();
      noiseFilter.type = 'lowpass';
      noiseFilter.frequency.setValueAtTime(1200, now);
      noiseFilter.frequency.exponentialRampToValueAtTime(35, now + 0.7);

      const noiseGain = this.ctx.createGain();
      noiseGain.gain.setValueAtTime(0.7, now);
      noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.72);

      noise.connect(noiseFilter);
      noiseFilter.connect(noiseGain);
      noiseGain.connect(this.sfxGain);
      noise.start(now);

      const subOsc = this.ctx.createOscillator();
      const subGain = this.ctx.createGain();
      subOsc.type = 'sawtooth';
      subOsc.frequency.setValueAtTime(190, now);
      subOsc.frequency.exponentialRampToValueAtTime(22, now + 0.85);

      subGain.gain.setValueAtTime(0.75, now);
      subGain.gain.exponentialRampToValueAtTime(0.001, now + 0.85);

      subOsc.connect(subGain);
      subGain.connect(this.sfxGain);
      subOsc.start(now);
      subOsc.stop(now + 0.85);
    } catch (e) {}
  }

  playCountdownBeep(freq = 900) {
    if (!this.soundEnabled || !this.audioUnlocked) return;
    this.init();

    try {
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, now);

      gain.gain.setValueAtTime(0.25, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);

      osc.connect(gain);
      gain.connect(this.sfxGain);
      osc.start(now);
      osc.stop(now + 0.09);
    } catch (e) {}
  }

  playLaunchSound() {
    if (!this.soundEnabled || !this.audioUnlocked) return;
    this.init();

    try {
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();

      osc.type = 'triangle';
      osc.frequency.setValueAtTime(280, now);
      osc.frequency.exponentialRampToValueAtTime(740, now + 0.22);

      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);

      osc.connect(gain);
      gain.connect(this.sfxGain);
      osc.start(now);
      osc.stop(now + 0.25);
    } catch (e) {}
  }

  playCashout() {
    if (!this.soundEnabled || !this.audioUnlocked) return;
    this.init();

    try {
      const now = this.ctx.currentTime;
      const notes = [587.33, 739.99, 880.00, 1174.66];
      notes.forEach((freq, idx) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now + idx * 0.07);
        gain.gain.setValueAtTime(0.22, now + idx * 0.07);
        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.07 + 0.32);
        osc.connect(gain);
        gain.connect(this.sfxGain);
        osc.start(now + idx * 0.07);
        osc.stop(now + idx * 0.07 + 0.32);
      });
    } catch (e) {}
  }

  toggleSound() {
    this.init();
    this.soundEnabled = !this.soundEnabled;
    if (this.masterGain && this.ctx) {
      this.masterGain.gain.setValueAtTime(this.soundEnabled ? this.userVolume : 0, this.ctx.currentTime);
    }
    if (!this.soundEnabled) {
      this.stopRiser();
    }
    return this.soundEnabled;
  }

  setVolume(val) {
    this.userVolume = parseFloat(val);
    if (this.masterGain && this.ctx && this.soundEnabled) {
      this.masterGain.gain.setValueAtTime(this.userVolume, this.ctx.currentTime);
    }
  }
}

function generateCrashPoint() {

// Volumetric Expanding Smoke Trail
class SmokeParticle {
  constructor(x, y, vx, vy, initialSize = 4, maxLife = 40) {
    this.x = x;
    this.y = y;
    this.vx = vx;
    this.vy = vy;
    this.size = initialSize;
    this.maxLife = maxLife;
    this.life = 0;
    this.alpha = 0.65;
    this.rotation = Math.random() * Math.PI * 2;
    this.rotSpeed = (Math.random() - 0.5) * 0.05;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vx *= 0.96;
    this.vy *= 0.96;
    this.size += 0.4;
    this.rotation += this.rotSpeed;
    this.life++;
    this.alpha = Math.max(0, 0.65 * (1 - this.life / this.maxLife));
  }
  draw(ctx) {
    if (this.alpha <= 0) return;
    ctx.save();
    ctx.globalAlpha = this.alpha;
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rotation);

    const grad = ctx.createRadialGradient(0, 0, 1, 0, 0, this.size);
    grad.addColorStop(0, 'rgba(235, 245, 255, 0.7)');
    grad.addColorStop(0.5, 'rgba(140, 180, 220, 0.35)');
    grad.addColorStop(1, 'rgba(15, 25, 45, 0)');
    ctx.fillStyle = grad;

    ctx.beginPath();
    ctx.arc(0, 0, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

// Fire & Explosion Sparks
class FireParticle {
  constructor(x, y, color, vx, vy, life = 35, size = 3) {
    this.x = x;
    this.y = y;
    this.color = color;
    this.vx = vx;
    this.vy = vy;
    this.life = 0;
    this.maxLife = life;
    this.size = size;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.life++;
  }
  draw(ctx) {
    const alpha = Math.max(0, 1 - this.life / this.maxLife);
    if (alpha <= 0) return;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

class Shockwave {
  constructor(x, y, maxRadius = 110) {
    this.x = x;
    this.y = y;
    this.radius = 4;
    this.maxRadius = maxRadius;
  }
  update() {
    this.radius += 4.5;
  }
  draw(ctx) {
    const alpha = Math.max(0, 1 - this.radius / this.maxRadius);
    if (alpha <= 0) return;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = '#ff1744';
    ctx.lineWidth = 3;
    ctx.shadowColor = '#ff1744';
    ctx.shadowBlur = 16;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }
}

// ----------------------------------------------------
// DETAILED 3D-STYLED SUPERSONIC JET RENDERER
// ----------------------------------------------------
function drawRealistic3DAircraft(ctx, x, y, angle, bankRoll, thrust) {
  ctx.save();
  ctx.translate(x, y);

  // 1. Realistic Altitude Drop Shadow
  ctx.save();
  const shadowDist = 28;
  ctx.translate(-shadowDist * 0.4, shadowDist);
  ctx.rotate(angle);
  ctx.scale(0.85, 0.45);
  ctx.fillStyle = 'rgba(2, 6, 16, 0.45)';
  ctx.filter = 'blur(6px)';
  ctx.beginPath();
  ctx.ellipse(0, 0, 42, 16, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Rotate & Apply Dynamic 3D Bank / Roll Perspective
  ctx.rotate(angle);
  const rollCompression = 1 - Math.abs(bankRoll) * 0.35;
  ctx.scale(1, rollCompression);
  ctx.transform(1, 0, bankRoll * 0.3, 1, 0, 0);

  // 2. Glowing Afterburner Jet Engine Exhaust
  const exhaustLen = 22 + Math.random() * 12 * Math.min(thrust, 2.8);
  const coreLen = exhaustLen * 0.65;

  // Dual engine nozzles (-24, -5.5) and (-24, 5.5)
  [-5.5, 5.5].forEach(offsetY => {
    // Outer Plasma Cone
    const outerFlame = ctx.createLinearGradient(-22, offsetY, -22 - exhaustLen, offsetY);
    outerFlame.addColorStop(0, 'rgba(0, 229, 255, 0.95)');
    outerFlame.addColorStop(0.3, 'rgba(0, 140, 255, 0.7)');
    outerFlame.addColorStop(0.7, 'rgba(255, 110, 0, 0.4)');
    outerFlame.addColorStop(1, 'transparent');

    ctx.fillStyle = outerFlame;
    ctx.beginPath();
    ctx.moveTo(-22, offsetY - 3.8);
    ctx.lineTo(-22 - exhaustLen, offsetY);
    ctx.lineTo(-22, offsetY + 3.8);
    ctx.closePath();
    ctx.fill();

    // Hot Core Cone
    const coreFlame = ctx.createLinearGradient(-22, offsetY, -22 - coreLen, offsetY);
    coreFlame.addColorStop(0, '#ffffff');
    coreFlame.addColorStop(0.4, '#00e5ff');
    coreFlame.addColorStop(1, 'transparent');

    ctx.fillStyle = coreFlame;
    ctx.beginPath();
    ctx.moveTo(-22, offsetY - 2);
    ctx.lineTo(-22 - coreLen, offsetY);
    ctx.lineTo(-22, offsetY + 2);
    ctx.closePath();
    ctx.fill();

    // Afterburner Shock Diamonds
    for (let d = 1; d <= 3; d++) {
      const dx = -22 - d * (exhaustLen * 0.22);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.ellipse(dx, offsetY, 2.5, 1.2, 0, 0, Math.PI * 2);
      ctx.stroke();
    }
  });

  // Engine Exhaust Glow Bloom
  const glow = ctx.createRadialGradient(-24, 0, 2, -24, 0, 22);
  glow.addColorStop(0, 'rgba(0, 229, 255, 0.85)');
  glow.addColorStop(0.5, 'rgba(0, 140, 255, 0.3)');
  glow.addColorStop(1, 'transparent');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(-24, 0, 22, 0, Math.PI * 2);
  ctx.fill();

  // 3. Port (Far) Swept Delta Wing
  const wingGradLeft = ctx.createLinearGradient(-15, -28, 10, 0);
  wingGradLeft.addColorStop(0, '#1c263c');
  wingGradLeft.addColorStop(0.4, '#2d3b5c');
  wingGradLeft.addColorStop(0.8, '#43547d');
  wingGradLeft.addColorStop(1, '#667ba4');

  ctx.fillStyle = wingGradLeft;
  ctx.beginPath();
  ctx.moveTo(8, -5);
  ctx.lineTo(-22, -28); // Wingtip left
  ctx.lineTo(-14, -6);
  ctx.closePath();
  ctx.fill();

  // Left Wing Aileron Detail Line
  ctx.strokeStyle = '#151e30';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(-18, -23);
  ctx.lineTo(-10, -7);
  ctx.stroke();

  // Port Nav Light (Red LED)
  ctx.fillStyle = '#ff1744';
  ctx.shadowColor = '#ff1744';
  ctx.shadowBlur = 8;
  ctx.beginPath();
  ctx.arc(-22, -28, 1.8, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // 4. Starboard (Near) Swept Delta Wing
  const wingGradRight = ctx.createLinearGradient(-15, 28, 10, 0);
  wingGradRight.addColorStop(0, '#24324f');
  wingGradRight.addColorStop(0.4, '#475b87');
  wingGradRight.addColorStop(0.8, '#8ba4cf');
  wingGradRight.addColorStop(1, '#b5cbe8');

  ctx.fillStyle = wingGradRight;
  ctx.beginPath();
  ctx.moveTo(8, 5);
  ctx.lineTo(-22, 28); // Wingtip right
  ctx.lineTo(-14, 6);
  ctx.closePath();
  ctx.fill();

  // Right Wing Leading Edge Specular Highlight
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(8, 5);
  ctx.lineTo(-22, 28);
  ctx.stroke();

  // Right Wing Aileron Detail Line
  ctx.strokeStyle = '#1f2b45';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(-18, 23);
  ctx.lineTo(-10, 7);
  ctx.stroke();

  // Starboard Nav Light (Green LED)
  ctx.fillStyle = '#00e676';
  ctx.shadowColor = '#00e676';
  ctx.shadowBlur = 8;
  ctx.beginPath();
  ctx.arc(-22, 28, 1.8, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // 5. Dual Cylindrical Jet Engine Nacelles (3D Shaded)
  [-5.5, 5.5].forEach(offsetY => {
    const nacelleGrad = ctx.createLinearGradient(-24, offsetY - 4, -24, offsetY + 4);
    nacelleGrad.addColorStop(0, '#1c263c');
    nacelleGrad.addColorStop(0.35, '#8ba2cc'); // metallic specular highlight
    nacelleGrad.addColorStop(0.7, '#34456a');
    nacelleGrad.addColorStop(1, '#111827');

    ctx.fillStyle = nacelleGrad;
    ctx.beginPath();
    ctx.roundRect(-24, offsetY - 3.5, 18, 7, 3);
    ctx.fill();

    // Titanium Nozzle Rim
    ctx.fillStyle = '#d4af37';
    ctx.fillRect(-24.5, offsetY - 3.2, 1.8, 6.4);
  });

  // 6. Main 3D Fuselage Body with Cylindrical Metallic Reflection
  const fuseGrad = ctx.createLinearGradient(0, -9, 0, 9);
  fuseGrad.addColorStop(0.0, '#1e2942');
  fuseGrad.addColorStop(0.2, '#384973');
  fuseGrad.addColorStop(0.42, '#ffffff'); // bright top chrome sheen
  fuseGrad.addColorStop(0.65, '#88a0cc');
  fuseGrad.addColorStop(0.9, '#253352');
  fuseGrad.addColorStop(1.0, '#0e1524');

  ctx.fillStyle = fuseGrad;
  ctx.beginPath();
  ctx.moveTo(34, 0);          // Sharp radar needle nose
  ctx.lineTo(16, -4.5);
  ctx.lineTo(-12, -7);
  ctx.lineTo(-24, -6);        // Engine mount left
  ctx.lineTo(-23, 0);         // Tail spine
  ctx.lineTo(-24, 6);         // Engine mount right
  ctx.lineTo(-12, 7);
  ctx.lineTo(16, 4.5);
  ctx.closePath();
  ctx.fill();

  // Dark Composite Radome (Nose Cone Tip)
  ctx.fillStyle = '#0f172a';
  ctx.beginPath();
  ctx.moveTo(34, 0);
  ctx.lineTo(26, -2.5);
  ctx.lineTo(26, 2.5);
  ctx.closePath();
  ctx.fill();

  // Aerodynamic Fuselage Panel Seams
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
  ctx.lineWidth = 0.8;
  ctx.beginPath();
  ctx.moveTo(14, -4);
  ctx.lineTo(14, 4);
  ctx.moveTo(0, -6);
  ctx.lineTo(0, 6);
  ctx.moveTo(-10, -6.5);
  ctx.lineTo(-10, 6.5);
  ctx.stroke();

  // 7. Canted Twin Vertical Stabilizers (Rudders)
  // Left Vertical Tail Fin
  ctx.fillStyle = '#2b3b5e';
  ctx.beginPath();
  ctx.moveTo(-16, -4);
  ctx.lineTo(-25, -11);
  ctx.lineTo(-22, -4);
  ctx.closePath();
  ctx.fill();

  // Right Vertical Tail Fin (Lit side)
  const tailGrad = ctx.createLinearGradient(-16, 4, -25, 11);
  tailGrad.addColorStop(0, '#5971a1');
  tailGrad.addColorStop(1, '#9cb7e6');
  ctx.fillStyle = tailGrad;
  ctx.beginPath();
  ctx.moveTo(-16, 4);
  ctx.lineTo(-25, 11);
  ctx.lineTo(-22, 4);
  ctx.closePath();
  ctx.fill();

  // 8. Polarized Tinted Cockpit Glass Canopy
  const canopyGrad = ctx.createLinearGradient(6, -3, 18, 3);
  canopyGrad.addColorStop(0, '#00e5ff');
  canopyGrad.addColorStop(0.5, '#0d47a1');
  canopyGrad.addColorStop(1, '#00102a');

  ctx.fillStyle = canopyGrad;
  ctx.beginPath();
  ctx.ellipse(11, 0, 10.5, 3.6, 0, 0, Math.PI * 2);
  ctx.fill();

  // Cockpit Glass Specular Glare Arc
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
  ctx.lineWidth = 1.3;
  ctx.beginPath();
  ctx.arc(11, -1.2, 8, -Math.PI * 0.7, -Math.PI * 0.25);
  ctx.stroke();

  // Cockpit Heads-Up Display (HUD) Interior Glow
  ctx.fillStyle = 'rgba(0, 230, 118, 0.75)';
  ctx.shadowColor = '#00e676';
  ctx.shadowBlur = 5;
  ctx.beginPath();
  ctx.ellipse(14, 0, 1.8, 1.2, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // 9. Pulsing Anti-Collision Strobe on Tail
  if (Math.floor(Date.now() / 350) % 2 === 0) {
    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = '#ffffff';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(-22, 0, 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  ctx.restore();
}

function renderEnvironment(width, height, speed) {
  ctx.fillStyle = '#0a0e1a';
  ctx.fillRect(0, 0, width, height);

  ctx.strokeStyle = 'rgba(34, 45, 74, 0.45)';
  ctx.lineWidth = 1;
  const gridOffset = (Date.now() * 0.05 * speed) % 30;

  for (let x = -gridOffset; x < width; x += 30) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x - 30, height);
    ctx.stroke();
  }
  for (let y = gridOffset; y < height; y += 30) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(width, y);
    ctx.stroke();
  }

  stars.forEach(star => {
    star.x -= star.speed * (1 + speed * 1.6);
    star.y += star.speed * 0.4;
    if (star.x < 0) star.x = width;
    if (star.y > height) star.y = 0;

    ctx.fillStyle = `rgba(255, 255, 255, ${star.alpha})`;
    ctx.beginPath();
    ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
    ctx.fill();
  });

  if (state === GAME_STATE.FLYING) {
    speedLines.forEach(line => {
      line.x -= line.speed * (1.5 + speed * 1.8);
      line.y += (Math.random() - 0.5) * 0.8;
      if (line.x < -line.len) {
        line.x = width + Math.random() * 40;
        line.y = Math.random() * height;
      }
      ctx.strokeStyle = `rgba(0, 229, 255, ${line.alpha})`;
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(line.x, line.y);
      ctx.lineTo(line.x - line.len, line.y);
      ctx.stroke();
    });
  }
}

function killAllTimers() {
  if (countdownIntervalId) {
    clearInterval(countdownIntervalId);
    countdownIntervalId = null;
  }
  if (animFrameId) {
    cancelAnimationFrame(animFrameId);
    animFrameId = null;
  }
}

// ----------------------------------------------------
// ROUND LIFECYCLE CONTROLLER
// ----------------------------------------------------

function start5SecondCountdown() {
  killAllTimers();
  state = GAME_STATE.COUNTDOWN;

  multiplier = 1.00;
  displayMultiplier = 1.00;
  multiplierText.className = 'multiplier-display';
  multiplierText.innerText = '1.00x';
  multiplierText.style.transform = 'scale(1)';
  lastCrashBanner.style.display = 'none';
  smokeParticles = [];
  fireParticles = [];
  shockwaves = [];
  arenaContainer.classList.remove('screen-shake');
  lastBeepSec = -1;

  if (autoBetCheckbox.checked && !isBetQueuedForNext) {
    isBetQueuedForNext = true;
  }

  updateActionBtnUI();

  prevCrashValue.innerText = (crashHistory[0] || 1.00).toFixed(2) + 'x';
  countdownOverlay.style.display = 'flex';
  statusPill.innerText = 'PREPARING TAKEOFF';
  statusPill.style.color = 'var(--accent-cyan)';

  const duration = 5000;
  const startCountTime = Date.now();

  animFrameId = requestAnimationFrame(gameLoop);

  countdownIntervalId = setInterval(() => {
    const elapsed = Date.now() - startCountTime;
    const remaining = Math.max(0, duration - elapsed);
    const seconds = (remaining / 1000).toFixed(1);

    countdownSecText.innerText = `${seconds}s`;
    countdownFill.style.width = `${(remaining / duration) * 100}%`;

    const wholeSec = Math.ceil(remaining / 1000);
    if (wholeSec <= 3 && wholeSec >= 1 && wholeSec !== lastBeepSec) {
      lastBeepSec = wholeSec;
      sound.playCountdownBeep(wholeSec === 1 ? 1200 : 880);
    }

    if (remaining <= 0) {
      clearInterval(countdownIntervalId);
      countdownIntervalId = null;
      countdownOverlay.style.display = 'none';
      launchRound();
    }
  }, 50);
}

function launchRound() {
  killAllTimers();
  state = GAME_STATE.FLYING;

  hasCashedOut = false;
  currentBet = parseInt(betInput.value, 10) || 50;

  if (isBetQueuedForNext) {
    if (balance >= currentBet) {
      balance -= currentBet;
      updateBalanceUI();
      isBetActiveThisRound = true;
    } else {
      isBetActiveThisRound = false;
      alert("Insufficient coins for queued bet! Spectating round.");
    }
  } else {
    isBetActiveThisRound = false;
  }

  crashPoint = generateCrashPoint();
  multiplier = 1.00;
  displayMultiplier = 1.00;
  startTime = Date.now();
  smokeParticles = [];
  fireParticles = [];
  shockwaves = [];

  statusPill.innerText = 'IN FLIGHT';
  statusPill.style.color = '#00e5ff';
  multiplierText.className = 'multiplier-display';
  multiplierText.innerText = '1.00x';
  lastCrashBanner.style.display = 'none';

  updateActionBtnUI();

  sound.playLaunchSound();
  sound.startRiser();

  animFrameId = requestAnimationFrame(gameLoop);
}

function triggerCrash() {
  if (state !== GAME_STATE.FLYING) return;

  state = GAME_STATE.CRASHED;
  multiplier = crashPoint;
  displayMultiplier = crashPoint;

  sound.playCrash();

  arenaContainer.classList.remove('screen-shake');
  void arenaContainer.offsetWidth;
  arenaContainer.classList.add('screen-shake');

  shockwaves.push(new Shockwave(planeX, planeY, 120));

  // Multi-stage realistic explosion
  for (let i = 0; i < 45; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 8 + 2;
    fireParticles.push(new FireParticle(
      planeX,
      planeY,
      ['#ff1744', '#ff9100', '#ffd600', '#ffffff'][Math.floor(Math.random() * 4)],
      Math.cos(angle) * speed,
      Math.sin(angle) * speed,
      40,
      Math.random() * 3.5 + 2
    ));
  }
  for (let i = 0; i < 25; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 3 + 0.6;
    smokeParticles.push(new SmokeParticle(
      planeX,
      planeY,
      Math.cos(angle) * speed,
      Math.sin(angle) * speed - 0.7,
      Math.random() * 5 + 4,
      55
    ));
  }

  multiplierText.className = 'multiplier-display crashed';
  multiplierText.innerText = crashPoint.toFixed(2) + 'x';
  multiplierText.style.transform = 'scale(1.1)';
  
  lastCrashBanner.style.display = 'block';
  lastCrashBanner.innerText = `CRASHED @ ${crashPoint.toFixed(2)}x`;
  
  statusPill.innerText = `FINAL MULTIPLIER: ${crashPoint.toFixed(2)}x`;
  statusPill.style.color = '#ff1744';

  crashHistory.unshift(crashPoint);
  if (crashHistory.length > 10) {
    crashHistory.pop();
  }
  renderHistory();

  isBetActiveThisRound = false;
  if (!autoBetCheckbox.checked) {
    isBetQueuedForNext = false;
  }
  updateActionBtnUI();

  setTimeout(() => {
    if (state === GAME_STATE.CRASHED) {
      start5SecondCountdown();
    }
  }, 2200);
}

function handleCashout() {
  if (state !== GAME_STATE.FLYING || !isBetActiveThisRound || hasCashedOut) return;

  hasCashedOut = true;
  cashedOutAmount = Math.floor(currentBet * multiplier);
  balance += cashedOutAmount;
  updateBalanceUI();

  sound.playCashout();

  statusPill.innerText = `CASHED OUT (+${cashedOutAmount} VC)`;
  statusPill.style.color = '#00e676';

  updateActionBtnUI();
}

// Master Animation Loop
function gameLoop() {
  const rect = canvas.getBoundingClientRect();
  const width = rect.width;
  const height = rect.height;

  let speedFactor = 1;

  if (state === GAME_STATE.FLYING) {
    const elapsed = (Date.now() - startTime) / 1000;
    const nextMultiplier = +(Math.pow(Math.E, 0.065 * elapsed)).toFixed(2);

    if (nextMultiplier >= crashPoint) {
      triggerCrash();
      return;
    }

    multiplier = nextMultiplier;

    displayMultiplier += (multiplier - displayMultiplier) * 0.35;
    multiplierText.innerText = displayMultiplier.toFixed(2) + 'x';

    const pulseScale = 1.0 + Math.min(0.2, (multiplier - 1) * 0.02) + Math.sin(Date.now() * 0.008) * 0.02;
    multiplierText.style.transform = `scale(${pulseScale})`;

    speedFactor = Math.min(4.5, 1 + (multiplier - 1) * 0.16);

    sound.updateRiser(multiplier);

    const autoTarget = parseFloat(autoCashInput.value);
    if (!isNaN(autoTarget) && autoTarget > 1.00 && multiplier >= autoTarget && isBetActiveThisRound && !hasCashedOut) {
      handleCashout();
    }

    if (isBetActiveThisRound && !hasCashedOut) {
      const currentWin = Math.floor(currentBet * multiplier);
      btnSubLabel.innerText = `WIN ${currentWin.toLocaleString()} VC`;
    }
  }

  renderEnvironment(width, height, speedFactor);

  if (state === GAME_STATE.FLYING || state === GAME_STATE.CRASHED) {
    const startX = 35;
    const startY = height - 35;
    const targetX = width * 0.74;
    const targetY = height * 0.22;

    const progress = Math.min(1, (multiplier - 1) / 3.0);
    const targetPlaneX = startX + (targetX - startX) * Math.sin((progress * Math.PI) / 2);
    const targetPlaneY = startY - (startY - targetY) * Math.sin((progress * Math.PI) / 2);

    // Smooth position interpolation
    planeX += (targetPlaneX - planeX) * 0.3;
    planeY += (targetPlaneY - planeY) * 0.3;

    // Compute Exact Flight Trajectory Tangent Angle
    const dx = (targetX - startX) * (Math.PI / 2) * Math.cos((progress * Math.PI) / 2);
    const dy = -(startY - targetY) * (Math.PI / 2) * Math.cos((progress * Math.PI) / 2);
    const flightAngle = Math.atan2(dy, dx);

    // Aerodynamic Turbulence & Banking Roll
    const turbulence = Math.sin(Date.now() * 0.005) * 0.035;
    planeAngle += (flightAngle + turbulence - planeAngle) * 0.15;
    bankRoll = Math.sin(Date.now() * 0.004) * 0.18 - (dy / 250);

    // Trajectory Curve
    ctx.save();
    ctx.strokeStyle = hasCashedOut ? '#00e676' : '#00e5ff';
    ctx.lineWidth = 3.5;
    ctx.shadowColor = hasCashedOut ? '#00e676' : '#00e5ff';
    ctx.shadowBlur = 12;

    ctx.beginPath();
    ctx.moveTo(startX, startY);
    ctx.quadraticCurveTo(startX + (planeX - startX) * 0.5, startY, planeX, planeY);
    ctx.stroke();

    ctx.lineTo(planeX, height);
    ctx.lineTo(startX, height);
    ctx.closePath();
    const areaGrad = ctx.createLinearGradient(0, planeY, 0, height);
    areaGrad.addColorStop(0, hasCashedOut ? 'rgba(0, 230, 118, 0.25)' : 'rgba(0, 229, 255, 0.25)');
    areaGrad.addColorStop(1, 'transparent');
    ctx.fillStyle = areaGrad;
    ctx.fill();
    ctx.restore();

    // Emit Engine Smoke & Vapor Trails
    if (state === GAME_STATE.FLYING) {
      const smokeSpreadAngle = planeAngle + Math.PI;
      const trailX = planeX - Math.cos(planeAngle) * 26;
      const trailY = planeY - Math.sin(planeAngle) * 26;

      // Volumetric smoke puffs
      smokeParticles.push(new SmokeParticle(
        trailX,
        trailY,
        Math.cos(smokeSpreadAngle) * (Math.random() * 2 + 1.5) - 1.2,
        Math.sin(smokeSpreadAngle) * (Math.random() * 2 + 1.5),
        Math.random() * 4 + 3.5,
        45
      ));

      // Draw the 3D-styled Supersonic Jet
      drawRealistic3DAircraft(ctx, planeX, planeY, planeAngle, bankRoll, speedFactor);
    }
  } else {
    // Parked Runway Idling Animation
    const parkX = 55;
    const parkY = height - 50 + Math.sin(Date.now() * 0.004) * 2.5;
    drawRealistic3DAircraft(ctx, parkX, parkY, -Math.PI / 16, 0.05, 0.5);
  }

  // Draw Shockwaves
  for (let i = shockwaves.length - 1; i >= 0; i--) {
    shockwaves[i].update();
    shockwaves[i].draw(ctx);
    if (shockwaves[i].radius >= shockwaves[i].maxRadius) {
      shockwaves.splice(i, 1);
    }
  }

  // Draw Smoke Trails
  for (let i = smokeParticles.length - 1; i >= 0; i--) {
    smokeParticles[i].update();
    smokeParticles[i].draw(ctx);
    if (smokeParticles[i].alpha <= 0) {
      smokeParticles.splice(i, 1);
    }
  }

  // Draw Fire Particles
  for (let i = fireParticles.length - 1; i >= 0; i--) {
    fireParticles[i].update();
    fireParticles[i].draw(ctx);
    if (fireParticles[i].life >= fireParticles[i].maxLife) {
      fireParticles.splice(i, 1);
    }
  }

  animFrameId = requestAnimationFrame(gameLoop);
}

// UI Synchronization
function updateActionBtnUI() {
  const betVal = betInput.value || 50;

  if (state === GAME_STATE.FLYING) {
    if (isBetActiveThisRound && !hasCashedOut) {
      mainActionBtn.className = 'btn-main cashout';
      btnMainLabel.innerText = 'CASH OUT';
      btnSubLabel.innerText = `WIN ${Math.floor(currentBet * multiplier)} VC`;
    } else if (hasCashedOut) {
      mainActionBtn.className = 'btn-main waiting';
      btnMainLabel.innerText = 'CASHED OUT';
      btnSubLabel.innerText = `+${cashedOutAmount} VC`;
    } else {
      mainActionBtn.className = 'btn-main waiting';
      btnMainLabel.innerText = 'IN FLIGHT';
      btnSubLabel.innerText = 'SPECTATING ROUND';
    }
  } else {
    if (isBetQueuedForNext) {
      mainActionBtn.className = 'btn-main bet-placed';
      btnMainLabel.innerText = 'BET QUEUED (TAP TO CANCEL)';
      btnSubLabel.innerText = `${betVal} VC LOCKED`;
    } else {
      mainActionBtn.className = 'btn-main bet-ready';
      btnMainLabel.innerText = 'BET FOR NEXT ROUND';
      btnSubLabel.innerText = `${betVal} VC`;
    }
  }
}

mainActionBtn.addEventListener('click', () => {
  if (state === GAME_STATE.FLYING) {
    if (isBetActiveThisRound && !hasCashedOut) {
      handleCashout();
    }
  } else {
    isBetQueuedForNext = !isBetQueuedForNext;
    updateActionBtnUI();
  }
});

function setBet(val) {
  val = Math.min(balance, Math.max(10, val));
  betInput.value = val;
  updateActionBtnUI();
}

document.getElementById('btnHalf').addEventListener('click', () => {
  let val = Math.max(10, Math.floor(parseInt(betInput.value || 0, 10) / 2));
  setBet(val);
});

document.getElementById('btnDouble').addEventListener('click', () => {
  let val = Math.min(balance, Math.floor(parseInt(betInput.value || 0, 10) * 2));
  setBet(val);
});

document.getElementById('btnMax').addEventListener('click', () => {
  setBet(balance);
});

betInput.addEventListener('input', updateActionBtnUI);

function updateBalanceUI() {
  balanceText.innerText = balance.toLocaleString();
}

soundBtn.addEventListener('click', () => {
  const isEnabled = sound.toggleSound();
  soundBtn.className = isEnabled ? 'btn-icon active' : 'btn-icon muted';
  soundIcon.innerText = isEnabled ? '🔊' : '🔇';
});

volumeSlider.addEventListener('input', (e) => {
  sound.setVolume(e.target.value);
});

resetBankBtn.addEventListener('click', () => {
  balance += 500;
  updateBalanceUI();
  alert("Added +500 free Virtual Coins to your balance!");
});

window.addEventListener('load', () => {
  start5SecondCountdown();
});
</script>
